name: Olix
description: 'Olix (OLIX Computing) is a stealth-stage hardware company building a new computing
  architecture that integrates SRAM with photonics to address the computational bottlenecks of
  large-scale AI deployment. The company positions its SRAM-plus-photonics design to surpass
  HBM-based architectures on throughput-per-megawatt and total cost of ownership while outperforming
  silicon-only alternatives on speed and latency as frontier-model demand compounds faster than
  today''s infrastructure can scale. Backed by Creandum, Olix is currently pre-product and hiring
  across the US and UK; it publishes no public API, SDK, developer portal, or documentation at this
  time. This profile was surfaced as a Creandum portfolio company and added to the API Evangelist
  network as an enrichment lead.'
